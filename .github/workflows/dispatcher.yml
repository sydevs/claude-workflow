# The dispatcher.
#
# Every GitHub event in the five sydevs repos reaches this reusable workflow
# through a thin caller (workflow-state.yml in each repo). It classifies the
# event with no tokens, applies the `bot:working` lock, and fires one cloud
# routine per handler with a pointer. Everything an event determines —
# merge, mark ready, board Status, `awaiting`, Sentry resolve, unblocking,
# the implement queue, the residue sweep — happens here, mechanically.
#
# The decision is re-derived from current GitHub state on every run. The
# event is a wake-up. That is what makes storms, cancelled pending runs and
# stale payloads safe. Code lives in dispatcher/ at the repo root; the pure
# parts are covered by `node --test dispatcher/test/*.test.mjs`.
#
# Two jobs: `resolve` maps the event to one or more items; `act` handles one
# item per matrix leg, serialized per item by a concurrency group. Beside
# them, `journal` keeps the day issue, `deps` fires a dependency fix only
# when Dependabot has one due, and `contracts-plan` and `contracts-sync`
# re-sync a consumer's copy of a producer's contract.
#
# why: sydevs/claude-workflow/docs/why.md#actions-observes-classifies-locks-and-fires
name: Dispatcher

on:
  workflow_call:
    inputs:
      dry-run:
        description: Log the plan; write nothing and fire nothing.
        required: false
        type: boolean
        default: false
    secrets:
      SYDEVS_BOT_PAT:
        required: true
      SENTRY_CLAUDE_WORKFLOW_TOKEN:
        required: false
      ROUTINE_TOKEN_SAHAJCLOUD:
        required: false
      ROUTINE_TOKEN_SAHAJATLASWEB:
        required: false
      ROUTINE_TOKEN_WEMEDITATEWEB:
        required: false
      ROUTINE_TOKEN_SAHAJATLASWORDPRESS:
        required: false
      ROUTINE_TOKEN_CLAUDE_WORKFLOW:
        required: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      # Our own default branch, never the PR head. The caller runs on
      # pull_request_target with nothing checked out; this job checks out
      # only claude-workflow's dispatcher code.
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      - id: resolve
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { resolveTargets, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            const config = loadConfig(`${cw}/loop-config.json`)
            const targets = await resolveTargets({ github, context, core, config })
            core.setOutput('targets', JSON.stringify(targets))

  act:
    needs: resolve
    if: needs.resolve.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    # One running plus one pending per item. Older pending runs are
    # cancelled, which is safe only because the decision is re-derived.
    concurrency:
      group: dispatch-${{ matrix.target.repo.name }}-${{ matrix.target.number }}
      cancel-in-progress: false
    env:
      TARGET: ${{ toJSON(matrix.target) }}
      DRY_RUN: ${{ inputs.dry-run }}
      SENTRY_CLAUDE_WORKFLOW_TOKEN: ${{ secrets.SENTRY_CLAUDE_WORKFLOW_TOKEN }}
      ROUTINE_TOKEN_SAHAJCLOUD: ${{ secrets.ROUTINE_TOKEN_SAHAJCLOUD }}
      ROUTINE_TOKEN_SAHAJATLASWEB: ${{ secrets.ROUTINE_TOKEN_SAHAJATLASWEB }}
      ROUTINE_TOKEN_WEMEDITATEWEB: ${{ secrets.ROUTINE_TOKEN_WEMEDITATEWEB }}
      ROUTINE_TOKEN_SAHAJATLASWORDPRESS: ${{ secrets.ROUTINE_TOKEN_SAHAJATLASWORDPRESS }}
      ROUTINE_TOKEN_CLAUDE_WORKFLOW: ${{ secrets.ROUTINE_TOKEN_CLAUDE_WORKFLOW }}
      ROUTINE_ID_SAHAJCLOUD: ${{ vars.ROUTINE_ID_SAHAJCLOUD }}
      ROUTINE_ID_SAHAJATLASWEB: ${{ vars.ROUTINE_ID_SAHAJATLASWEB }}
      ROUTINE_ID_WEMEDITATEWEB: ${{ vars.ROUTINE_ID_WEMEDITATEWEB }}
      ROUTINE_ID_SAHAJATLASWORDPRESS: ${{ vars.ROUTINE_ID_SAHAJATLASWORDPRESS }}
      ROUTINE_ID_CLAUDE_WORKFLOW: ${{ vars.ROUTINE_ID_CLAUDE_WORKFLOW }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      # No `run:` step interpolates github.event.*; event data reaches node
      # only through context.payload and the TARGET env var.
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { act, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            const config = loadConfig(`${cw}/loop-config.json`)
            const target = JSON.parse(process.env.TARGET)
            const dryRun = process.env.DRY_RUN === 'true'
            await act({ github, context, core, config, target, env: process.env, dryRun })

  journal:
    # Only the journal repo's schedule maintains the day issue and its title.
    if: github.event_name == 'schedule' && github.repository == 'sydevs/claude-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { journalTick, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            await journalTick({ github, core, config: loadConfig(`${cw}/loop-config.json`), dryRun: ${{ inputs.dry-run }} })

  # The daily vulnerability check. It reads each repo's open Dependabot
  # alerts and fires `audit-deps` there only when one is due — opened in
  # the last day, or, on the catch-up day, still open with a fix — and no
  # dependency PR is already open. A quiet week costs no session. The
  # values are `deps` in loop-config.json on main. The cron is the journal
  # repo's caller's; change both together.
  # why: sydevs/claude-workflow/docs/why.md#a-vulnerability-is-checked-before-a-session-is-spent
  deps:
    if: >-
      github.repository == 'sydevs/claude-workflow'
      && ((github.event_name == 'schedule' && github.event.schedule == '20 13 * * *') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ inputs.dry-run }}
      ROUTINE_TOKEN_SAHAJCLOUD: ${{ secrets.ROUTINE_TOKEN_SAHAJCLOUD }}
      ROUTINE_TOKEN_SAHAJATLASWEB: ${{ secrets.ROUTINE_TOKEN_SAHAJATLASWEB }}
      ROUTINE_TOKEN_WEMEDITATEWEB: ${{ secrets.ROUTINE_TOKEN_WEMEDITATEWEB }}
      ROUTINE_TOKEN_SAHAJATLASWORDPRESS: ${{ secrets.ROUTINE_TOKEN_SAHAJATLASWORDPRESS }}
      ROUTINE_TOKEN_CLAUDE_WORKFLOW: ${{ secrets.ROUTINE_TOKEN_CLAUDE_WORKFLOW }}
      ROUTINE_ID_SAHAJCLOUD: ${{ vars.ROUTINE_ID_SAHAJCLOUD }}
      ROUTINE_ID_SAHAJATLASWEB: ${{ vars.ROUTINE_ID_SAHAJATLASWEB }}
      ROUTINE_ID_WEMEDITATEWEB: ${{ vars.ROUTINE_ID_WEMEDITATEWEB }}
      ROUTINE_ID_SAHAJATLASWORDPRESS: ${{ vars.ROUTINE_ID_SAHAJATLASWORDPRESS }}
      ROUTINE_ID_CLAUDE_WORKFLOW: ${{ vars.ROUTINE_ID_CLAUDE_WORKFLOW }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { depsTick, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            await depsTick({ github, core, config: loadConfig(`${cw}/loop-config.json`), env: process.env, dryRun: process.env.DRY_RUN === 'true' })

  # A consumer's committed copy of a producer's file — the generated Payload
  # types, the atlas URL contract — re-synced as soon as the producer's PR
  # merges. One bot PR per consumer, which the loop then carries like any
  # other: CI, `fix-ci` if the new shape breaks the consumer, your approval.
  # No ticket: a sync is the fix, not a proposal. The values, and the
  # commands, are `contractSync` in loop-config.json on main.
  # why: sydevs/claude-workflow/docs/why.md#a-contract-sync-is-a-pr-not-a-ticket
  contracts-plan:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      consumers: ${{ steps.plan.outputs.consumers }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      - id: plan
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { planContractSync, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            const consumers = await planContractSync({ github, context, core, config: loadConfig(`${cw}/loop-config.json`) })
            core.setOutput('consumers', JSON.stringify(consumers))

  contracts-sync:
    needs: contracts-plan
    if: needs.contracts-plan.outputs.consumers != '[]' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJSON(needs.contracts-plan.outputs.consumers) }}
    # Two producer merges in a row queue, so the second builds on the first's PR.
    concurrency:
      group: contract-sync-${{ matrix.consumer.name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.SYDEVS_BOT_PAT }}
      REPO: ${{ matrix.consumer.repo }}
      BRANCH: ${{ matrix.consumer.branch }}
      SYNC_COMMAND: ${{ matrix.consumer.command }}
      SYNC_PATHS: ${{ join(matrix.consumer.paths, ' ') }}
      SOURCE_PR: ${{ matrix.consumer.sourcePr }}
    steps:
      # The consumer's own main, never a PR head, and its own sync script.
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.consumer.repo }}
          ref: main
          token: ${{ secrets.SYDEVS_BOT_PAT }}
          path: consumer
          fetch-depth: 0
      # No `version:` input: pnpm's version comes from the consumer's
      # `packageManager`, and naming it twice makes action-setup fail.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: consumer/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Re-sync, then open or update the PR
        working-directory: consumer
        run: |
          set -euo pipefail
          git config user.name sydevs-bot
          git config user.email 322523691+sydevs-bot@users.noreply.github.com
          open=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            # Build on the open PR, so a fix-ci commit already on it survives.
            git fetch -q origin "$BRANCH"
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -q -B "$BRANCH" origin/main
          fi
          bash -c "$SYNC_COMMAND"
          # SYNC_PATHS is a space-separated list, split on purpose.
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $SYNC_PATHS)" ]; then
            echo "Already current. Nothing to open."
            exit 0
          fi
          # shellcheck disable=SC2086
          git add -- $SYNC_PATHS
          git commit -q -m "chore(contracts): re-sync from $SOURCE_PR"
          if [ -n "$open" ]; then
            git push -q origin "HEAD:$BRANCH"
            echo "Updated #$open."
            exit 0
          fi
          # A branch left by a PR closed unmerged is replaced, not built on.
          git push -q --force origin "HEAD:$BRANCH"
          body=$(printf '%s\n' \
            '## Summary' '' \
            "- Re-syncs this repo's copy of a SahajCloud contract, after $SOURCE_PR merged." \
            "- Produced by \`$SYNC_COMMAND\` on \`main\`, with no hand edits." '' \
            '## Test results' '' \
            '- CI runs on this PR. If the new shape breaks this repo, `fix-ci` adapts the code here, and the adversarial review then reads it.' '' \
            '## Notes for reviewer' '' \
            'Opened by the dispatcher contract sync (`contractSync` in sydevs/claude-workflow `loop-config.json`), not from a ticket. A later producer merge adds its commit here while this PR is open.')
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --draft \
            --title "chore(contracts): re-sync copied contracts from SahajCloud" --body "$body"
