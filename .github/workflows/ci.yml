# CI for this repo's own pull requests. Until this file, nothing ran the
# tests before a merge, and a merge here is the deploy to every consumer.
#
# It runs what `leanGate.command` in .claude/workflow.json runs by hand, plus
# the dispatcher tests (in no gate before) and a JSON parse of every config.
# It checks out the PR's merge commit and runs it with no secrets and a
# read-only token, so a PR can run its own tests and nothing else.
#
# The workflow is named "CI" because workflow-state.yml listens for a
# `workflow_run` of that name, so a red run reaches `fix-ci` on a bot PR.
# Mark `CI / test` required in the ruleset to make it a merge gate.
name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Config files parse
        run: |
          set -euo pipefail
          git ls-files '*.json' | while read -r f; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
      - name: Dispatcher and workflow/lib tests
        run: node --test dispatcher/test/*.test.mjs workflow/lib/*.test.mjs
      # The same check `claude plugin validate` is run by hand for. The CLI
      # needs no login for it. Pinned, so a CLI release cannot redden a PR.
      - name: Plugin manifest and skill frontmatter
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.311
          claude plugin validate ./workflow --strict
      # CLAUDE.md: an installed plugin is keyed by `version`, so a change to
      # anything the plugin ships that leaves it alone never reaches an
      # install. `workflow/lib` ships too: skills call its scripts as
      # `${CLAUDE_PLUGIN_ROOT}/lib/<script>`. Tests are excluded — they run
      # from the checkout, never from an install.
      - name: Plugin version is bumped with plugin changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- workflow/skills workflow/hooks workflow/lib ':!*.test.mjs')
          [ -n "$changed" ] || { echo "Nothing the plugin ships changed."; exit 0; }
          version() { git show "$1:workflow/.claude-plugin/plugin.json" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).version)'; }
          before=$(version "$BASE_SHA")
          after=$(version "$HEAD_SHA")
          if [ "$before" = "$after" ]; then
            echo "::error file=workflow/.claude-plugin/plugin.json::Plugin files changed but version is still $before. An installed plugin never updates without a version bump (CLAUDE.md)."
            echo "$changed"
            exit 1
          fi
          echo "version $before -> $after"
