# Every GitHub event in this repo reaches the dispatcher in
# sydevs/claude-workflow, gated by the org variable BOT_DISPATCH:
#
#   on    the dispatcher — classifies, locks, fires cloud routines
#   dry   the dispatcher, logging what it would do, writing nothing
#   any other value, including unset: nothing runs
#
# All rules live in claude-workflow, so the five repos cannot drift apart.
# This copy is the journal repo's: it also carries the daily journal and
# dependency-check crons.
# https://github.com/sydevs/claude-workflow/blob/main/.github/workflows/dispatcher.yml
name: Workflow state

on:
  issues:
    # Only the actions resolve.mjs turns into work. assigned and the field
    # events had no rule since the state machine retired, so each was an
    # empty run. (why: docs/why.md#subscribe-only-to-what-resolves)
    types: [opened, edited, reopened, transferred, closed, unlabeled, typed, untyped]
  issue_comment:
    types: [created]
  # pull_request_target, not pull_request: the org secrets must be present,
  # and nothing gets checked out from the PR. That is what makes it safe.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]
  # No pull_request_review_thread: it is a webhook event, not an Actions
  # trigger — GitHub rejects the whole file. The sweeper re-derives every
  # open, unlocked bot PR instead, so a resolved thread is seen within 30
  # minutes. (why: docs/why.md#a-resolved-thread-fires-no-workflow)
  workflow_run:
    workflows: [CI]
    types: [completed]
  check_suite:
    types: [completed]
  status:
  schedule:
    - cron: '*/30 * * * *'   # residue sweeper
    - cron: '5 7 * * *'      # journal day, 00:05 America/Vancouver (PDT)
    - cron: '5 8 * * *'      # journal day, 00:05 America/Vancouver (PST)
    - cron: '20 13 * * *'    # dependency check — the `deps` job in dispatcher.yml matches this string
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    # Skipped here, before a runner starts: a label other than the lock
    # coming off (the dispatcher removes awaiting, stuck and proposal on most
    # passes), and an edit that left the body alone. `bot:working` is
    # labels.lock in loop-config.json — change both together.
    if: >-
      (vars.BOT_DISPATCH == 'on' || vars.BOT_DISPATCH == 'dry')
      && !(github.event.action == 'unlabeled' && github.event.label.name != 'bot:working')
      && !(github.event_name == 'issues' && github.event.action == 'edited' && !github.event.changes.body)
    uses: sydevs/claude-workflow/.github/workflows/dispatcher.yml@main
    with:
      dry-run: ${{ vars.BOT_DISPATCH == 'dry' }}
    secrets: inherit
