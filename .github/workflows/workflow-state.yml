# This workflow maintains Stage, assignees, and the `awaiting` label from
# GitHub events. It adds new items to the org workflow board. All rules
# live in the reusable workflow below, so the five repos cannot drift apart:
# https://github.com/sydevs/claude-workflow/blob/main/.github/workflows/state-machine.yml
name: Workflow state

on:
  issues:
    types: [opened, reopened, transferred, closed, assigned, field_added, field_removed]
  issue_comment:
    types: [created]
  # This uses pull_request_target, not pull_request. The org secret must be
  # available. Nothing here checks out the PR code. That combination keeps
  # the secret safe.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  state:
    uses: sydevs/claude-workflow/.github/workflows/state-machine.yml@main
    secrets:
      token: ${{ secrets.ADD_TO_PROJECT_PAT }}
