# The dispatcher.
#
# Every GitHub event in the five sydevs repos reaches this reusable workflow
# through a thin caller (workflow-state.yml in each repo). It classifies the
# event with no tokens, applies the `bot:working` lock, and fires one cloud
# routine per handler with a pointer. Everything an event determines —
# arming auto-merge, mark ready, board Status, `awaiting`, Sentry resolve, unblocking,
# the implement queue, the residue sweep — happens here, mechanically.
#
# The decision is re-derived from current GitHub state on every run. The
# event is a wake-up. That is what makes storms, cancelled pending runs and
# stale payloads safe. Code lives in dispatcher/ at the repo root; the pure
# parts are covered by `node --test dispatcher/test/*.test.mjs`.
#
# Two jobs: `resolve` maps the event to one or more items; `act` handles one
# item per matrix leg, serialized per item by a concurrency group. Beside
# them, `journal` keeps the day issue, `deps` fires a dependency fix only
# when Dependabot has one due, `contracts-plan` and `contracts-sync`
# re-sync a consumer's copy of a producer's contract, and `contracts-verify`
# approves a re-sync that matches its source.
#
# why: sydevs/claude-workflow/docs/why.md#actions-observes-classifies-locks-and-fires
name: Dispatcher

on:
  workflow_call:
    inputs:
      dry-run:
        description: Log the plan; write nothing and fire nothing.
        required: false
        type: boolean
        default: false
    secrets:
      SYDEVS_BOT_PAT:
        required: true
      SENTRY_CLAUDE_WORKFLOW_TOKEN:
        required: false
      ROUTINE_TOKEN_SAHAJCLOUD:
        required: false
      ROUTINE_TOKEN_SAHAJATLASWEB:
        required: false
      ROUTINE_TOKEN_WEMEDITATEWEB:
        required: false
      ROUTINE_TOKEN_SAHAJATLASWORDPRESS:
        required: false
      ROUTINE_TOKEN_CLAUDE_WORKFLOW:
        required: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      # Our own default branch, never the PR head. The caller runs on
      # pull_request_target with nothing checked out; this job checks out
      # only claude-workflow's dispatcher code.
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      - id: resolve
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { resolveTargets, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            const config = loadConfig(`${cw}/loop-config.json`)
            const targets = await resolveTargets({ github, context, core, config })
            core.setOutput('targets', JSON.stringify(targets))

  act:
    needs: resolve
    if: needs.resolve.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    # One running plus one pending per item. Older pending runs are
    # cancelled, which is safe only because the decision is re-derived.
    concurrency:
      group: dispatch-${{ matrix.target.repo.name }}-${{ matrix.target.number }}
      cancel-in-progress: false
    # The calling repo's own token, used only to re-run a job that failed on
    # infrastructure. Every caller grants `actions: write` on its dispatch job;
    # a caller that did not would fail this job before it starts.
    # (why: docs/why.md#an-infrastructure-failure-is-re-run-not-repaired)
    permissions:
      actions: write
    env:
      TARGET: ${{ toJSON(matrix.target) }}
      ACTIONS_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry-run }}
      SENTRY_CLAUDE_WORKFLOW_TOKEN: ${{ secrets.SENTRY_CLAUDE_WORKFLOW_TOKEN }}
      ROUTINE_TOKEN_SAHAJCLOUD: ${{ secrets.ROUTINE_TOKEN_SAHAJCLOUD }}
      ROUTINE_TOKEN_SAHAJATLASWEB: ${{ secrets.ROUTINE_TOKEN_SAHAJATLASWEB }}
      ROUTINE_TOKEN_WEMEDITATEWEB: ${{ secrets.ROUTINE_TOKEN_WEMEDITATEWEB }}
      ROUTINE_TOKEN_SAHAJATLASWORDPRESS: ${{ secrets.ROUTINE_TOKEN_SAHAJATLASWORDPRESS }}
      ROUTINE_TOKEN_CLAUDE_WORKFLOW: ${{ secrets.ROUTINE_TOKEN_CLAUDE_WORKFLOW }}
      ROUTINE_ID_SAHAJCLOUD: ${{ vars.ROUTINE_ID_SAHAJCLOUD }}
      ROUTINE_ID_SAHAJATLASWEB: ${{ vars.ROUTINE_ID_SAHAJATLASWEB }}
      ROUTINE_ID_WEMEDITATEWEB: ${{ vars.ROUTINE_ID_WEMEDITATEWEB }}
      ROUTINE_ID_SAHAJATLASWORDPRESS: ${{ vars.ROUTINE_ID_SAHAJATLASWORDPRESS }}
      ROUTINE_ID_CLAUDE_WORKFLOW: ${{ vars.ROUTINE_ID_CLAUDE_WORKFLOW }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      # No `run:` step interpolates github.event.*; event data reaches node
      # only through context.payload and the TARGET env var.
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { act, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            const config = loadConfig(`${cw}/loop-config.json`)
            const target = JSON.parse(process.env.TARGET)
            const dryRun = process.env.DRY_RUN === 'true'
            await act({ github, context, core, config, target, env: process.env, dryRun })

  journal:
    # Only the journal repo's schedule maintains the day issue and its title.
    if: github.event_name == 'schedule' && github.repository == 'sydevs/claude-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { journalTick, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            await journalTick({ github, core, config: loadConfig(`${cw}/loop-config.json`), dryRun: ${{ inputs.dry-run }} })

  # The daily vulnerability check. It reads each repo's open Dependabot
  # alerts and fires `audit-deps` there only when one is due — opened in
  # the last day, or, on the catch-up day, still open with a fix — and no
  # dependency PR is already open. A quiet week costs no session. The
  # values are `deps` in loop-config.json on main. The cron is the journal
  # repo's caller's; change both together.
  # why: sydevs/claude-workflow/docs/why.md#a-vulnerability-is-checked-before-a-session-is-spent
  deps:
    if: >-
      github.repository == 'sydevs/claude-workflow'
      && ((github.event_name == 'schedule' && github.event.schedule == '20 13 * * *') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ inputs.dry-run }}
      ROUTINE_TOKEN_SAHAJCLOUD: ${{ secrets.ROUTINE_TOKEN_SAHAJCLOUD }}
      ROUTINE_TOKEN_SAHAJATLASWEB: ${{ secrets.ROUTINE_TOKEN_SAHAJATLASWEB }}
      ROUTINE_TOKEN_WEMEDITATEWEB: ${{ secrets.ROUTINE_TOKEN_WEMEDITATEWEB }}
      ROUTINE_TOKEN_SAHAJATLASWORDPRESS: ${{ secrets.ROUTINE_TOKEN_SAHAJATLASWORDPRESS }}
      ROUTINE_TOKEN_CLAUDE_WORKFLOW: ${{ secrets.ROUTINE_TOKEN_CLAUDE_WORKFLOW }}
      ROUTINE_ID_SAHAJCLOUD: ${{ vars.ROUTINE_ID_SAHAJCLOUD }}
      ROUTINE_ID_SAHAJATLASWEB: ${{ vars.ROUTINE_ID_SAHAJATLASWEB }}
      ROUTINE_ID_WEMEDITATEWEB: ${{ vars.ROUTINE_ID_WEMEDITATEWEB }}
      ROUTINE_ID_SAHAJATLASWORDPRESS: ${{ vars.ROUTINE_ID_SAHAJATLASWORDPRESS }}
      ROUTINE_ID_CLAUDE_WORKFLOW: ${{ vars.ROUTINE_ID_CLAUDE_WORKFLOW }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { depsTick, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            await depsTick({ github, core, config: loadConfig(`${cw}/loop-config.json`), env: process.env, dryRun: process.env.DRY_RUN === 'true' })

  # A consumer's committed copy of a producer's file — the generated Payload
  # types, the atlas URL contract — re-synced as soon as the producer's PR
  # merges. A consumer PR its goal built beside that producer takes the
  # re-sync as a commit. Otherwise one bot PR per consumer, which the loop
  # then carries like any other: CI, `fix-ci` if the new shape breaks the
  # consumer, your approval. No ticket: a sync is the fix, not a proposal.
  # The values, and the commands, are `contractSync` in loop-config.json on main.
  # why: sydevs/claude-workflow/docs/why.md#a-contract-sync-is-a-pr-not-a-ticket
  # why: sydevs/claude-workflow/docs/why.md#docs-fixes-and-re-syncs-ride-the-feature
  contracts-plan:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      consumers: ${{ steps.plan.outputs.consumers }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      - id: plan
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { planContractSync, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            const consumers = await planContractSync({ github, context, core, config: loadConfig(`${cw}/loop-config.json`) })
            core.setOutput('consumers', JSON.stringify(consumers))

  contracts-sync:
    needs: contracts-plan
    if: needs.contracts-plan.outputs.consumers != '[]' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJSON(needs.contracts-plan.outputs.consumers) }}
    # Two producer merges in a row queue, so the second builds on the first's PR.
    concurrency:
      group: contract-sync-${{ matrix.consumer.name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.SYDEVS_BOT_PAT }}
      REPO: ${{ matrix.consumer.repo }}
      BRANCH: ${{ matrix.consumer.branch }}
      SYNC_COMMAND: ${{ matrix.consumer.command }}
      SYNC_PATHS: ${{ join(matrix.consumer.paths, ' ') }}
      SOURCE_PR: ${{ matrix.consumer.sourcePr }}
      FEATURE_PR: ${{ matrix.consumer.featurePr }}
      FEATURE_BRANCH: ${{ matrix.consumer.featureBranch }}
    steps:
      # The consumer's own main, never a PR head, and its own sync script.
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.consumer.repo }}
          ref: main
          token: ${{ secrets.SYDEVS_BOT_PAT }}
          path: consumer
          fetch-depth: 0
      # No `version:` input: pnpm's version comes from the consumer's
      # `packageManager`, and naming it twice makes action-setup fail.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: consumer/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Re-sync, then open or update the PR
        working-directory: consumer
        run: |
          set -euo pipefail
          git config user.name sydevs-bot
          git config user.email 322523691+sydevs-bot@users.noreply.github.com
          # The goal's consumer PR first, so the re-sync merges with the
          # feature. A push it refuses falls through to the sync PR.
          # Any failure here — the branch gone, the PR merged while this job
          # queued, a sync script that fails on it — falls through too.
          feature_open() { [ "$(gh pr view "$FEATURE_PR" --repo "$REPO" --json state --jq .state 2>/dev/null)" = "OPEN" ]; }
          if [ -n "${FEATURE_BRANCH:-}" ] && feature_open \
            && git fetch -q origin "$FEATURE_BRANCH" \
            && git checkout -q -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH" \
            && bash -c "$SYNC_COMMAND"; then
            # shellcheck disable=SC2086
            if [ -z "$(git status --porcelain -- $SYNC_PATHS)" ]; then
              echo "#$FEATURE_PR is already current."
              exit 0
            fi
            # shellcheck disable=SC2086
            git add -- $SYNC_PATHS
            git commit -q -m "chore(contracts): re-sync from $SOURCE_PR"
            if feature_open && git push -q origin "HEAD:$FEATURE_BRANCH"; then
              echo "Re-synced on #$FEATURE_PR."
              exit 0
            fi
            echo "Could not re-sync on #$FEATURE_PR. Falling back to the sync PR."
          fi
          git checkout -q -f origin/main
          open=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            # Build on the open PR, so a fix-ci commit already on it survives.
            git fetch -q origin "$BRANCH"
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -q -B "$BRANCH" origin/main
          fi
          bash -c "$SYNC_COMMAND"
          # SYNC_PATHS is a space-separated list, split on purpose.
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $SYNC_PATHS)" ]; then
            echo "Already current. Nothing to open."
            exit 0
          fi
          # shellcheck disable=SC2086
          git add -- $SYNC_PATHS
          git commit -q -m "chore(contracts): re-sync from $SOURCE_PR"
          if [ -n "$open" ]; then
            git push -q origin "HEAD:$BRANCH"
            echo "Updated #$open."
            exit 0
          fi
          # A branch left by a PR closed unmerged is replaced, not built on.
          git push -q --force origin "HEAD:$BRANCH"
          body=$(printf '%s\n' \
            '## Summary' '' \
            "- Re-syncs this repo's copy of a SahajCloud contract, after $SOURCE_PR merged." \
            "- Produced by \`$SYNC_COMMAND\` on \`main\`, with no hand edits." '' \
            '## Test results' '' \
            '- CI runs on this PR. If the new shape breaks this repo, `fix-ci` adapts the code here, and the adversarial review then reads it.' '' \
            '## Notes for reviewer' '' \
            'Opened by the dispatcher contract sync (`contractSync` in sydevs/claude-workflow `loop-config.json`), not from a ticket. A later producer merge adds its commit here while this PR is open.')
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --draft \
            --title "chore(contracts): re-sync copied contracts from SahajCloud" --body "$body"

  # A contract-sync PR has one correct content, so it is checked here, not by
  # a person: the consumer's sync command is re-run on the consumer's own
  # `main` and compared with the PR head. A byte-for-byte match on a ready bot
  # PR that changes nothing but the copy is approved with this repo's own
  # token, as github-actions[bot] — the PAT is sydevs-bot, the PR's author,
  # whose approval GitHub refuses, and the sync job runs in the producer, whose
  # token cannot approve here. The verdict is then posted as the
  # `contractSync.verifyContext` status, as sydevs-bot so its event wakes the
  # dispatcher, which asks the reviewer on a mismatch. Nothing from the PR
  # runs: the head is only fetched and diffed, and the command and the script
  # it runs come from `main`. Every caller grants `pull-requests: write` on its
  # dispatch job; a caller that did not would fail this whole workflow.
  # why: sydevs/claude-workflow/docs/why.md#a-verified-contract-sync-is-approved-by-actions
  contracts-verify:
    # The gate in contracts.mjs decides; this only spares a runner on every
    # other event. `claude/` is dispatch.sessionBranchPrefix.
    if: >-
      github.event_name == 'pull_request_target'
      && contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review"]'), github.event.action)
      && startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    # A newer head supersedes an older one's check.
    concurrency:
      group: contract-verify-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sydevs/claude-workflow
          ref: main
          path: cw
          persist-credentials: false
          sparse-checkout: |
            loop-config.json
            workflow/lib
            dispatcher
      - id: plan
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { planContractVerify, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            const v = await planContractVerify({ github, context, core, config: loadConfig(`${cw}/loop-config.json`) })
            core.setOutput('verify', String(v.verify))
            core.setOutput('sha', v.sha || '')
            core.setOutput('command', v.command || '')
            core.setOutput('paths', (v.paths || []).join(' '))
      # The consumer's own main, never the PR head: the sync script runs from here.
      - if: steps.plan.outputs.verify == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SYDEVS_BOT_PAT }}
          path: consumer
      # No `version:` input: pnpm's version comes from the consumer's `packageManager`.
      - if: steps.plan.outputs.verify == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: consumer/package.json
      - if: steps.plan.outputs.verify == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: compare
        if: steps.plan.outputs.verify == 'true'
        working-directory: consumer
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          SYNC_COMMAND: ${{ steps.plan.outputs.command }}
          SYNC_PATHS: ${{ steps.plan.outputs.paths }}
        run: |
          set -euo pipefail
          bash -c "$SYNC_COMMAND"
          git fetch -q --depth=1 origin "$SHA"
          # Staged, so a copy main lacks is compared too. SYNC_PATHS is split on purpose.
          # shellcheck disable=SC2086
          git add -- $SYNC_PATHS
          # shellcheck disable=SC2086
          if git diff --cached --quiet "$SHA" -- $SYNC_PATHS; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            # shellcheck disable=SC2086
            git diff --cached --stat "$SHA" -- $SYNC_PATHS
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi
      # This repo's own token: the only identity here that may approve the bot's PR.
      - id: approve
        if: steps.compare.outputs.matched == 'true' && !inputs.dry-run
        uses: actions/github-script@v9
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          SYNC_COMMAND: ${{ steps.plan.outputs.command }}
        with:
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { approveContractSync } = await import(`${cw}/dispatcher/index.mjs`)
            await approveContractSync({ github, context, core, sha: process.env.SHA, command: process.env.SYNC_COMMAND })
      # A cancelled run was superseded by a newer head, which reports instead.
      # A plan that failed reports too, so no sync waits on a verdict that
      # never comes; the dispatcher reads it only on a contract-only sync.
      - if: ${{ !cancelled() && (steps.plan.outputs.verify == 'true' || steps.plan.outcome == 'failure') && !inputs.dry-run }}
        uses: actions/github-script@v9
        env:
          SHA: ${{ steps.plan.outputs.sha || github.event.pull_request.head.sha }}
          SYNC_COMMAND: ${{ steps.plan.outputs.command }}
          MATCHED: ${{ steps.compare.outputs.matched }}
          APPROVED: ${{ steps.approve.outcome == 'success' }}
        with:
          github-token: ${{ secrets.SYDEVS_BOT_PAT }}
          script: |
            const cw = `${process.env.GITHUB_WORKSPACE}/cw`
            const { contractVerdict, reportContractVerify, loadConfig } = await import(`${cw}/dispatcher/index.mjs`)
            const verdict = contractVerdict({ matched: process.env.MATCHED, approved: process.env.APPROVED === 'true', command: process.env.SYNC_COMMAND })
            await reportContractVerify({ github, context, core, config: loadConfig(`${cw}/loop-config.json`), sha: process.env.SHA, verdict })
